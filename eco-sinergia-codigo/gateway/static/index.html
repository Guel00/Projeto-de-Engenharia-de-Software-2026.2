<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Eco-Sinergia</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e8f5e9; text-align: center; margin-top: 50px; }
        .component { background: white; border-radius: 8px; padding: 20px; margin: 10px; display: inline-block; width: 300px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); vertical-align: top;}
        h2 { color: #2e7d32; }
        button { padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>🌱 Eco-Sinergia: Painel de Controle</h1>
    <button onclick="carregarJogo()">Atualizar Status da Cidade</button>
    
    <div id="painel" style="margin-top: 20px; display: none;">
        <div class="component" id="player-comp">
            <h2>Jogador</h2>
            <p id="player-data"></p>
        </div>
        <div class="component" id="city-comp">
            <h2>Cidade</h2>
            <p id="city-data"></p>
        </div>
        <div class="component" id="ai-comp">
            <h2>Agentes AI (População)</h2>
            <p id="ai-data"></p>
        </div>
        <div class="component" id="rec-comp">
            <h2>Recomendações (Sistema AI)</h2>
            <p id="rec-data"></p>
        </div>
    </div>

    <script>
        function carregarJogo() {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('painel').style.display = 'block';
                    document.getElementById('player-data').innerHTML = `Nível: ${data.player.level} <br> Dinheiro: R$ ${data.player.money}`;
                    document.getElementById('city-data').innerHTML = `Árvores: ${data.city.trees} <br> Prédios: ${data.city.buildings} <br> Poluição: ${data.city.pollution}%`;
                    document.getElementById('ai-data').innerHTML = `Felicidade: ${data.ai_reaction.happiness_impact}% <br> Feedback: ${data.ai_reaction.feedback}`;
                    document.getElementById('rec-data').innerHTML = `Dica: ${data.recommendation.tip}`;
                });
        }
    </script>
</body>
</html>
