services:
  player-service:
    build: ./services/player
    container_name: ecomissao-player
    ports:
      - "8001:8001"
    volumes:
      - player_data:/data
    environment:
      - PLAYER_DB=/data/players.db

  game-service:
    build: ./services/game
    container_name: ecomissao-game
    ports:
      - "8002:8002"

  agent-service:
    build: ./services/agent
    container_name: ecomissao-agent
    ports:
      - "8003:8003"

  gateway:
    build: ./gateway
    container_name: ecomissao-gateway
    ports:
      - "8000:8000"
    environment:
      - PLAYER_SERVICE_URL=http://player-service:8001
      - GAME_SERVICE_URL=http://game-service:8002
      - AGENT_SERVICE_URL=http://agent-service:8003
    depends_on:
      - player-service
      - game-service
      - agent-service

  frontend:
    build: ./frontend
    container_name: ecomissao-frontend
    ports:
      - "8080:80"
    depends_on:
      - gateway

volumes:
  player_data:
